<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rayan · X-Ray08 · just a curious student</title>
<meta name="description" content="Portfolio of Rayan (X-Ray08), M.Sc. Computer Science student at Hochschule Bochum. Projects, skills and an interactive terminal.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='68' font-size='52' font-family='monospace' text-anchor='middle' fill='white'>&gt;_</text></svg>">
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #18181b;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --term-bg: #0f1117;
    --term-text: #e5e7eb;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  [data-theme="dark"] {
    --bg: #0b0c10;
    --surface: #13151b;
    --text: #f4f4f5;
    --muted: #9ca3af;
    --border: #23262f;
    --accent: #818cf8;
    --accent-soft: #1e1b4b;
    --term-bg: #07080b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background .3s, color .3s;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .container { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* Nav */
  nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    border-bottom: 1px solid var(--border);
  }
  nav .container { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo { font-weight: 700; font-size: 1.05rem; }
  .logo span { color: var(--accent); }
  .theme-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: .82rem;
    transition: border-color .2s;
  }
  .theme-btn:hover { border-color: var(--accent); }

  /* Hero */
  .hero { padding: 96px 0 40px; }
  .hero h1 { font-size: clamp(2.4rem, 6vw, 4.2rem); line-height: 1.08; font-weight: 800; letter-spacing: -.03em; }
  .hero h1 .sub { color: var(--muted); }
  .typed { color: var(--muted); font-size: clamp(1.05rem, 2.2vw, 1.3rem); margin: 22px 0 0; min-height: 2em; }
  .typed .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); margin-left: 2px; vertical-align: text-bottom; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* Contact form */
  .contact { max-width: 520px; margin-top: 56px; }
  .contact h2 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
  .contact > p { color: var(--muted); font-size: .9rem; margin-bottom: 16px; }
  .contact .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .contact input, .contact textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit; font-size: .9rem;
  }
  .contact textarea { min-height: 96px; resize: vertical; display: block; }
  .contact input:focus, .contact textarea:focus { outline: none; border-color: var(--accent); }
  .contact .actions { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .contact button {
    padding: 9px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent);
    color: #fff; font: inherit; font-size: .9rem; font-weight: 600; cursor: pointer;
  }
  .contact button:disabled { opacity: .6; cursor: default; }
  .contact .status { font-size: .85rem; color: var(--muted); }
  .hp { display: none; }

  /* Sections */
  section { padding: 0 0 80px; }

  /* Terminal */
  .terminal {
    background: var(--term-bg); border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.25); border: 1px solid #1f2230;
  }
  .term-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #161922; border-bottom: 1px solid #1f2230; }
  .term-bar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .term-bar .title { margin-left: 10px; color: #6b7280; font-size: .8rem; }
  .term-body { height: 380px; overflow-y: auto; padding: 18px 20px; color: var(--term-text); font-size: .9rem; line-height: 1.7; cursor: text; }
  .term-body .line { white-space: pre-wrap; word-break: break-word; }
  .prompt { color: #22c55e; }
  .prompt b { color: #818cf8; font-weight: 600; }
  .term-input-row { display: flex; gap: 8px; }
  .term-input { flex: 1; background: none; border: none; outline: none; color: var(--term-text); font: inherit; caret-color: #22c55e; }
  .c-accent { color: #818cf8; } .c-green { color: #22c55e; } .c-yellow { color: #facc15; } .c-muted { color: #6b7280; } .c-cyan { color: #22d3ee; } .c-red { color: #f87171; }
  .term-hint { margin-top: 14px; color: var(--muted); font-size: .88rem; }
  .term-hint code { background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 6px; font-size: .82rem; }

  footer a { text-decoration: underline; }
  footer { padding: 40px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; text-align: center; }

  /* Reveal animation */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  @media (max-width: 760px) {
    .hero { padding: 64px 0 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="#" class="logo mono">&gt;_ X-Ray<span>08</span></a>
    <button class="theme-btn mono" id="themeBtn" aria-label="Toggle dark mode">dark</button>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1 class="reveal">Hi, I'm Rayan.<br><span class="sub">Just a curious student.</span></h1>
    <p class="typed mono reveal"><span id="typed"></span><span class="cursor"></span></p>
  </div>
</header>

<section id="terminal">
  <div class="container">
    <div class="terminal reveal">
      <div class="term-bar">
        <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
        <span class="title mono">guest@x-ray08: ~</span>
      </div>
      <div class="term-body mono" id="termBody">
        <div id="termOut"></div>
        <div class="term-input-row">
          <span class="prompt"><b>guest@x-ray08</b>:~$</span>
          <input class="term-input" id="termInput" autocomplete="off" spellcheck="false" aria-label="Terminal input">
        </div>
      </div>
    </div>

    <form class="contact reveal" id="contactForm">
      <h2>Contact</h2>
      <p>Send me a message and I'll get back to you.</p>
      <div class="row">
        <input name="name" placeholder="Name" required aria-label="Name">
        <input name="email" type="email" placeholder="Email" required aria-label="Email">
      </div>
      <textarea name="message" placeholder="Message" required aria-label="Message"></textarea>
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
      <div class="actions">
        <button type="submit">Send</button>
        <span class="status" id="formStatus" role="status"></span>
      </div>
    </form>
  </div>
</section>

<footer>
  <div class="container">&copy; <span id="year"></span> Rayan · <a href="privacy.html">Privacy</a></div>
</footer>

<script>
/* ===== Edit your info here ===== */
const ME = {
  name: "Rayan",
  github: "https://github.com/X-Ray08",
  email: "ray.pybot@gmail.com",
  linkedin: "https://www.linkedin.com/in/rayanchicho",
};

/* Terminal log: paste your Google Apps Script web app URL here (leave "" to turn logging off) */
const LOG_URL = "https://script.google.com/macros/s/AKfycbyNS4iqjZ1Gk74YjFdgI_6SgdvMZ3-YJR9E_nMUlWC00vXfOEIBCW-cb1tBK5FzQDnG/exec";

/* Theme toggle (follows system preference on first load) */
const root = document.documentElement;
const themeBtn = document.getElementById("themeBtn");
function setTheme(t) { root.setAttribute("data-theme", t); themeBtn.textContent = t === "dark" ? "light" : "dark"; }
setTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
themeBtn.onclick = () => setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");

document.getElementById("year").textContent = new Date().getFullYear();

/* Typing effect */
const phrases = ["M.Sc. Computer Science @ Hochschule Bochum", "Computer vision and OCR", "Built the first Kurdish OCR", "Go · Python · Linux"];
const typedEl = document.getElementById("typed");
let pi = 0, ci = 0, deleting = false;
(function type() {
  const p = phrases[pi];
  typedEl.textContent = p.slice(0, ci);
  if (!deleting && ci < p.length) ci++;
  else if (deleting && ci > 0) ci--;
  else if (!deleting) { deleting = true; return setTimeout(type, 1800); }
  else { deleting = false; pi = (pi + 1) % phrases.length; }
  setTimeout(type, deleting ? 35 : 65);
})();

/* Scroll reveal */
const io = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* ===== Terminal ===== */
const out = document.getElementById("termOut");
const input = document.getElementById("termInput");
const body = document.getElementById("termBody");
const history = []; let hIdx = 0;
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
let captured = null;
function print(html = "") {
  const d = document.createElement("div"); d.className = "line"; d.innerHTML = html;
  out.appendChild(d); body.scrollTop = body.scrollHeight;
  if (captured) captured.push(d.textContent);
}

/* Send each command and its result to the Google Sheet */
const SESSION = Math.random().toString(36).slice(2, 10);
function logCommand(command, output) {
  if (!LOG_URL) return;
  fetch(LOG_URL, {
    method: "POST", mode: "no-cors", keepalive: true,
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ session: SESSION, command: command.slice(0, 500), output: output.slice(0, 2000) }),
  }).catch(() => {});
}

const files = {
  "about.txt": "M.Sc. Informatik student at Hochschule Bochum, Germany.\nI like building software, automating workflows and solving problems\nthat matter to people. I built the first OCR system for Kurdish\n(Badini and Sorani) because existing tools didn't support my language.\nMostly writing Go and Python these days.\n\nLocation   Bochum, Germany\nLanguages  Kurdish, English, German",
  "skills.txt": "Python, Go, JavaScript, SQL, OpenCV, Tesseract, Git, Linux",
  "secret.txt": "<span class='c-yellow'>You found it. Try typing: matrix</span>",
};

const commands = {
  help: () => print(
`<span class="c-accent">Available commands:</span>
  <span class="c-green">whoami</span>      who am I?
  <span class="c-green">about</span>       short bio
  <span class="c-green">skills</span>      tech I use
  <span class="c-green">projects</span>    things I've built
  <span class="c-green">contact</span>     how to reach me
  <span class="c-green">neofetch</span>    system info, but about me
  <span class="c-green">ls</span> / <span class="c-green">cat</span>    browse files
  <span class="c-green">open</span> &lt;x&gt;    open github | linkedin | email
  <span class="c-green">theme</span>       toggle light/dark
  <span class="c-green">privacy</span>     what this site collects
  <span class="c-green">date</span>, <span class="c-green">echo</span>, <span class="c-green">history</span>, <span class="c-green">clear</span>`),
  whoami: () => print(`${ME.name}: CS Master's student, builder, problem solver.`),
  about: () => print(files["about.txt"]),
  skills: () => print(
`<span class="c-cyan">Languages</span>   Python ██████████  Go ████████░░  JS ██████░░░░
<span class="c-cyan">CV / ML</span>     OpenCV · Tesseract · NumPy
<span class="c-cyan">Web</span>         REST APIs · HTML/CSS · Go web servers
<span class="c-cyan">Tools</span>       Git · Linux · Automation`),
  projects: () => print(
`<span class="c-yellow">1.</span> <a class="c-accent" href="https://github.com/X-Ray08/Kurdish-OCR" target="_blank">Kurdish-OCR</a>
   First OCR for Kurdish (Badini and Sorani). Deskews documents with a
   four-point transform, preprocesses with OpenCV, reads text with Tesseract.
   <span class="c-muted">Python · OpenCV · Tesseract</span>

<span class="c-yellow">2.</span> <a class="c-accent" href="https://github.com/X-Ray08/Go-GroceryList" target="_blank">Go-GroceryList</a>
   Grocery list web app with a cmd / internal / web project layout.
   <span class="c-muted">Go</span>`),
  contact: () => print(
`email     <a class="c-accent" href="mailto:${ME.email}">${ME.email}</a>
github    <a class="c-accent" href="${ME.github}" target="_blank">${ME.github}</a>
linkedin  <a class="c-accent" href="${ME.linkedin}" target="_blank">${ME.linkedin}</a>`),
  neofetch: () => print(
`<span class="c-accent">   ██╗  ██╗</span>   <span class="c-green">guest</span>@<span class="c-green">x-ray08</span>
<span class="c-accent">   ╚██╗██╔╝</span>   ----------------
<span class="c-accent">    ╚███╔╝ </span>   <span class="c-cyan">Name</span>:      ${ME.name}
<span class="c-accent">    ██╔██╗ </span>   <span class="c-cyan">Degree</span>:    M.Sc. Informatik
<span class="c-accent">   ██╔╝ ██╗</span>   <span class="c-cyan">Uni</span>:       Hochschule Bochum
<span class="c-accent">   ╚═╝  ╚═╝</span>   <span class="c-cyan">Location</span>:  Bochum, DE
               <span class="c-cyan">Stack</span>:     Python, Go, OpenCV
               <span class="c-cyan">Uptime</span>:    ${Math.floor(performance.now() / 1000)}s on this page
               <span class="c-cyan">Coffee</span>:    ∞`),
  ls: () => print(Object.keys(files).map(f => `<span class="c-cyan">${f}</span>`).join("  ")),
  cat: a => a[0] ? (files[a[0]] !== undefined ? print(files[a[0]]) : print(`<span class="c-red">cat: ${esc(a[0])}: No such file</span>`)) : print("usage: cat &lt;file&gt;"),
  open: a => {
    const t = (a[0] || "").toLowerCase();
    if (t === "github") { window.open(ME.github, "_blank"); print("Opening GitHub..."); }
    else if (t === "linkedin") { window.open(ME.linkedin, "_blank"); print("Opening LinkedIn..."); }
    else if (t === "email") { location.href = "mailto:" + ME.email; print("Opening mail client..."); }
    else print("usage: open github | linkedin | email");
  },
  theme: () => { themeBtn.click(); print(`Theme switched to ${root.getAttribute("data-theme")}.`); },
  privacy: () => print(`Commands you type here and their output are logged anonymously (no IP address).\nFull details: <a class="c-accent" href="privacy.html">privacy.html</a>`),
  date: () => print(new Date().toString()),
  echo: a => print(esc(a.join(" "))),
  history: () => print(history.map((h, i) => `  ${i + 1}  ${esc(h)}`).join("\n")),
  clear: () => { out.innerHTML = ""; },
  sudo: () => print(`<span class="c-red">guest is not in the sudoers file. This incident will be reported.</span>`),
  "rm": a => a.join(" ").includes("-rf") ? print(`<span class="c-red">Nice try.</span>`) : print("rm: permission denied"),
  exit: () => print("There is no escape. Try <span class='c-green'>clear</span> instead."),
  matrix: () => matrix(),
};

function run(raw) {
  print(`<span class="prompt"><b>guest@x-ray08</b>:~$</span> ${esc(raw)}`);
  const [cmd, ...args] = raw.trim().split(/\s+/);
  if (!cmd) return;
  history.push(raw); hIdx = history.length;
  const fn = commands[cmd.toLowerCase()];
  captured = [];
  try { fn ? fn(args) : print(`<span class="c-red">command not found: ${esc(cmd)}</span>. Type <span class="c-green">help</span>.`); }
  finally { logCommand(raw.trim(), captured.join("\n")); captured = null; }
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") { run(input.value); input.value = ""; }
  else if (e.key === "ArrowUp") { if (hIdx > 0) input.value = history[--hIdx]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { input.value = hIdx < history.length - 1 ? history[++hIdx] : (hIdx = history.length, ""); e.preventDefault(); }
  else if (e.key === "Tab") {
    e.preventDefault();
    const m = Object.keys(commands).filter(c => c.startsWith(input.value));
    if (m.length === 1) input.value = m[0]; else if (m.length > 1) print(m.join("  "));
  }
  else if (e.key === "l" && e.ctrlKey) { e.preventDefault(); commands.clear(); }
});
body.addEventListener("click", () => { if (!window.getSelection().toString()) input.focus({ preventScroll: true }); });

/* Contact form (sent via formsubmit.co, falls back to the mail app) */
const form = document.getElementById("contactForm");
const formStatus = document.getElementById("formStatus");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  if (data._honey) return;
  const btn = form.querySelector("button");
  btn.disabled = true; formStatus.textContent = "Sending...";
  try {
    const r = await fetch(`https://formsubmit.co/ajax/${ME.email}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ name: data.name, email: data.email, message: data.message, _subject: "New message from X-Ray08.github.io", _template: "table" }),
    });
    if (!r.ok) throw new Error();
    form.reset(); formStatus.textContent = "Thanks, your message was sent.";
  } catch {
    formStatus.textContent = "Couldn't send. Opening your mail app instead.";
    location.href = `mailto:${ME.email}?subject=${encodeURIComponent("Message from " + data.name)}&body=${encodeURIComponent(data.message + "\n\n" + data.name + " <" + data.email + ">")}`;
  } finally { btn.disabled = false; }
});

/* Matrix easter egg */
function matrix() {
  const c = document.createElement("canvas");
  Object.assign(c.style, { position: "fixed", inset: 0, zIndex: 999, background: "#000", cursor: "pointer" });
  document.body.appendChild(c);
  const ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = Math.floor(c.width / 16), drops = Array(cols).fill(1);
  const chars = "アカサタナ01ХRAY08<>/{}";
  const iv = setInterval(() => {
    ctx.fillStyle = "rgba(0,0,0,.08)"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#22c55e"; ctx.font = "15px ui-monospace, Menlo, Consolas, monospace";
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16);
      drops[i] = y * 16 > c.height && Math.random() > .975 ? 0 : y + 1;
    });
  }, 40);
  const stop = () => { clearInterval(iv); c.remove(); };
  c.onclick = stop; setTimeout(stop, 6000);
  print("<span class='c-green'>Wake up, Neo... (click to exit)</span>");
}

/* Welcome message */
print(`<span class="c-accent">Welcome to X-Ray08's terminal</span> <span class="c-muted">v1.0</span>`);
print(`Type <span class="c-green">help</span> to see available commands. Try <span class="c-green">about</span>, <span class="c-green">projects</span> or <span class="c-green">contact</span>.`);
if (LOG_URL) print(`<span class="c-muted">Commands are logged anonymously to improve this site. See <a href="privacy.html" style="text-decoration:underline">privacy</a>.</span>`);
print("");
</script>
</body>
</html>
